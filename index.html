<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soufflé VE - Tienda Online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased">

    <!-- === CONFIGURACIÓN DE TUS DATOS === -->
    <script>
        // URL DE GOOGLE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbzukNs5x0ohnZ3mSD8YIaZILFtdo-hgZ3utYswJ64uxznXWq48qd_A-_wmhJsMgIc5Q/exec"; 
        
        // NÚMERO DE WHATSAPP
        const TELEFONO_WHATSAPP = "584243566603";
    </script>

    <!-- BARRA SUPERIOR DE NOTIFICACIÓN -->
    <div class="bg-black text-white text-xs sm:text-sm py-2.5 px-4 flex flex-col sm:flex-row justify-between items-center gap-1 border-b border-gray-800">
        <div>
            <span>Pedidos directos por <strong class="text-green-400">WhatsApp</strong> | Envíos a todo el país</span>
        </div>
        <div class="flex items-center gap-2">
            <span>Tasa Oficial BCV: <strong id="tasa-bcv-display" class="text-yellow-400">Cargando...</strong></span>
            <span>•</span>
            <span>Pagos en Bs. y Divisas</span>
        </div>
    </div>

    <!-- ENCABEZADO PRINCIPAL (SOUFFLÉ VE) -->
    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3">
                <!-- LOGO DE LA TIENDA -->
                <div class="w-10 h-10 rounded-xl overflow-hidden shadow-sm border border-gray-200 flex items-center justify-center bg-white">
                    <img src="https://i.ibb.co/3yyfhSTj/logo.jpg" alt="Soufflé VE Logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <span class="font-black text-xl text-black tracking-tight block leading-none">SOUFFLÉ <span class="text-xs bg-black text-white px-1.5 py-0.5 rounded ml-0.5 font-bold tracking-normal">VE</span></span>
                    <span class="text-[10px] text-gray-400 uppercase tracking-widest font-extrabold block mt-0.5">Showroom & Footwear</span>
                </div>
            </a>

            <div class="flex items-center gap-3">
                <a id="btn-whatsapp-general" href="#" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm py-2 px-4 rounded-full flex items-center gap-2 transition duration-200 shadow-sm">
                    <span>WhatsApp</span>
                </a>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- SECCIÓN DE BÚSQUEDA Y FILTROS -->
        <section class="mb-8 space-y-4">
            <!-- BARRA DE BÚSQUEDA EN TIEMPO REAL -->
            <div class="relative max-w-md w-full">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
                <input 
                    type="text" 
                    id="input-busqueda" 
                    oninput="aplicarFiltrosYBusqueda()"
                    placeholder="Buscar producto o marca..." 
                    class="block w-full pl-10 pr-10 py-2.5 border border-gray-200 rounded-xl bg-white text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition shadow-sm"
                >
                <button 
                    id="btn-limpiar-busqueda" 
                    onclick="limpiarBusqueda()" 
                    class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 text-sm font-bold"
                >
                    ✕
                </button>
            </div>

            <!-- FILTRO POR MARCA -->
            <div>
                <div class="mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-500">Filtrar por Marca:</span>
                </div>
                <div id="contenedor-marcas" class="flex flex-wrap gap-2">
                    <button onclick="filtrarMarca('todas')" class="btn-filtro bg-black text-white text-xs font-bold px-4 py-2 rounded-full shadow-sm transition">
                        Todas las Marcas
                    </button>
                </div>
            </div>
        </section>

        <!-- CABECERA DEL CATÁLOGO -->
        <div class="flex justify-between items-end mb-6">
            <div>
                <h2 class="text-2xl font-black text-gray-900 tracking-tight">Catálogo Disponible</h2>
                <p id="contador-productos" class="text-sm text-gray-500 font-medium">Cargando productos...</p>
            </div>
        </div>

        <!-- GRILLA DE PRODUCTOS -->
        <div id="grilla-productos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Los productos se cargarán dinámicamente aquí -->
        </div>

    </main>

    <!-- VENTANA MODAL PARA ZOOM / VISTA PREVIA AMPLIADA -->
    <div id="modal-zoom" class="fixed inset-0 z-50 bg-black/90 hidden flex items-center justify-center p-4">
        <button onclick="cerrarZoom()" class="absolute top-5 right-5 text-white bg-white/25 hover:bg-white/40 w-10 h-10 rounded-full flex items-center justify-center text-xl font-bold transition">✕</button>
        <div class="max-w-4xl max-h-[90vh] overflow-hidden flex items-center justify-center">
            <img id="imagen-zoom-src" src="" alt="Vista ampliada" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl">
        </div>
    </div>

    <!-- JAVASCRIPT LÓGICO Y ROBUSTO -->
    <script>
        let productosData = [];
        let tasaBCV = 0;
        let marcaSeleccionadaActual = 'todas';

        // Configurar botón general de WhatsApp
        document.getElementById('btn-whatsapp-general').href = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent('¡Hola Soufflé VE! Quisiera hacer una consulta sobre los productos disponibles.')}`;

        // Limpiar URL de imagen individual
        function limpiarUrlUnica(urlRaw) {
            if (!urlRaw) return '';
            const matchImg = String(urlRaw).match(/[img](.*?)\[\/img\]/i);
            if (matchImg && matchImg[1]) return matchImg[1].trim();

            const matchUrl = String(urlRaw).match(/\[url=(.*?)\]/i);
            if (matchUrl && matchUrl[1]) return matchUrl[1].trim();

            const matchSrc = String(urlRaw).match(/src=["'](.*?)["']/i);
            if (matchSrc && matchSrc[1]) return matchSrc[1].trim();

            return String(urlRaw).replace(/\[\/?(url\vert{}img).*?\]/gi, '').trim();
        }

      // Obtener array de fotos escaneando de forma inteligente todas las columnas
        function obtenerArrayFotos(prod) {
            let fotos = [];
            
            // Recorrer todas las columnas que vienen de Google Sheets
            for (let key in prod) {
                let valor = prod[key];
                if (valor) {
                    let limpia = limpiarUrlUnica(valor);
                    // Si el valor es una URL válida que empieza por http o https
                    if (limpia && limpia.startsWith('http') && !fotos.includes(limpia)) {
                        const kLower = key.toLowerCase();
                        // Evitar tomar celdas que sean textos informativos, precios o tallas
                        if (!kLower.includes('precio') && !kLower.includes('talla') && !kLower.includes('id') && !kLower.includes('marca') && !kLower.includes('nombre') && !kLower.includes('destacado')) {
                            
                            // Priorizar la foto principal al inicio del arreglo
                            if (kLower.includes('imagen_url') || kLower === 'imagen' || kLower === 'foto') {
                                fotos.unshift(limpia);
                            } else {
                                fotos.push(limpia);
                            }
                        }
                    }
                }
            }
            
            if (fotos.length === 0) fotos.push('https://via.placeholder.com/400x400?text=Sin+Imagen');
            return fotos;
        }      
            // Recorrer primero buscando coincidencias exactas ordenadas
            for (let kBase of llavesPosibles) {
                for (let key in prod) {
                    if (key.toLowerCase().trim() === kBase) {
                        const limpia = limpiarUrlUnica(prod[key]);
                        if (limpia && !fotos.includes(limpia)) {
                            fotos.push(limpia);
                        }
                    }
                }
            }

            // 2. Si faltaron por capturar, buscar cualquier otra columna que tenga contenido de imagen
            for (let key in prod) {
                const k = key.toLowerCase();
                if (k.includes('imagen') || k.includes('imagnen') || k.includes('foto') || k.includes('img')) {
                    const limpia = limpiarUrlUnica(prod[key]);
                    if (limpia && !fotos.includes(limpia)) {
                        fotos.push(limpia);
                    }
                }
            }

            if (fotos.length === 0) fotos.push('https://via.placeholder.com/400x400?text=Sin+Imagen');
            return fotos;
        }

        // Cargar datos con respaldo contra bloqueos CORS/Redirección
        async function cargarDatos() {
            try {
                const response = await fetch(API_URL, { method: 'GET', redirect: 'follow' });
                const data = await response.json();
                
                tasaBCV = Number(data.tasa_bcv || data.tasa || 0);
                productosData = data.productos || [];

                document.getElementById('tasa-bcv-display').innerText = `Bs. ${tasaBCV.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

                renderizarFiltrosMarcas();
                renderizarProductos(productosData);

            } catch (error) {
                console.error("Error al cargar los productos:", error);
                document.getElementById('contador-productos').innerText = "No se pudieron cargar los productos. Por favor reintenta en un momento.";
                document.getElementById('tasa-bcv-display').innerText = "N/D";
            }
        }

        function renderizarFiltrosMarcas() {
            const marcas = ['todas', ...new Set(productosData.map(p => p.marca).filter(Boolean))];
            const contenedor = document.getElementById('contenedor-marcas');
            
            contenedor.innerHTML = marcas.map(marca => {
                const esTodas = marca === 'todas';
                const nombreMostrar = esTodas ? 'Todas las Marcas' : marca;
                const claseActiva = esTodas ? 'bg-black text-white' : 'bg-white text-gray-700 hover:bg-gray-100 border border-gray-200';
                
                return `
                    <button onclick="filtrarMarca('${marca}', this)" class="btn-filtro ${claseActiva} text-xs font-bold px-4 py-2 rounded-full shadow-sm transition">
                        ${nombreMostrar}
                    </button>
                `;
            }).join('');
        }

        function filtrarMarca(marcaSeleccionada, elemento) {
            marcaSeleccionadaActual = marcaSeleccionada;

            document.querySelectorAll('.btn-filtro').forEach(btn => {
                btn.className = 'btn-filtro bg-white text-gray-700 hover:bg-gray-100 border border-gray-200 text-xs font-bold px-4 py-2 rounded-full shadow-sm transition';
            });

            if (elemento) {
                elemento.className = 'btn-filtro bg-black text-white text-xs font-bold px-4 py-2 rounded-full shadow-sm transition';
            } else {
                const primerBoton = document.querySelector('.btn-filtro');
                if (primerBoton) primerBoton.className = 'btn-filtro bg-black text-white text-xs font-bold px-4 py-2 rounded-full shadow-sm transition';
            }

            aplicarFiltrosYBusqueda();
        }

        function aplicarFiltrosYBusqueda() {
            const textoBusqueda = document.getElementById('input-busqueda').value.toLowerCase().trim();
            const btnLimpiar = document.getElementById('btn-limpiar-busqueda');

            if (textoBusqueda.length > 0) {
                btnLimpiar.classList.remove('hidden');
            } else {
                btnLimpiar.classList.add('hidden');
            }

            const resultado = productosData.filter(prod => {
                const coincideMarca = marcaSeleccionadaActual === 'todas' || 
                                     (prod.marca && prod.marca.toLowerCase() === marcaSeleccionadaActual.toLowerCase());

                const nombre = prod.nombre ? prod.nombre.toLowerCase() : '';
                const marca = prod.marca ? prod.marca.toLowerCase() : '';
                
                const coincideTexto = nombre.includes(textoBusqueda) || marca.includes(textoBusqueda);

                return coincideMarca && coincideTexto;
            });

            renderizarProductos(resultado);
        }

        function limpiarBusqueda() {
            document.getElementById('input-busqueda').value = '';
            aplicarFiltrosYBusqueda();
        }

        // Cambiar foto activa en la tarjeta mediante los botones numéricos
        function cambiarFoto(prodIndex, fotoUrl, btnElement) {
            const imgElement = document.getElementById(`img-prod-${prodIndex}`);
            if (imgElement) imgElement.src = fotoUrl;

            const contenedorBotones = document.getElementById(`botones-fotos-${prodIndex}`);
            if (contenedorBotones) {
                Array.from(contenedorBotones.children).forEach(btn => {
                    btn.className = "w-7 h-7 rounded-lg text-xs font-bold border border-gray-300 bg-white text-gray-700 hover:bg-gray-100 transition";
                });
                btnElement.className = "w-7 h-7 rounded-lg text-xs font-bold border border-black bg-black text-white shadow-sm transition";
            }
        }

        // Abrir Zoom / Vista Previa Ampliada
        function abrirZoom(prodIndex) {
            const imgElement = document.getElementById(`img-prod-${prodIndex}`);
            if (!imgElement) return;

            document.getElementById('imagen-zoom-src').src = imgElement.src;
            document.getElementById('modal-zoom').classList.remove('hidden');
        }

        function cerrarZoom() {
            document.getElementById('modal-zoom').classList.add('hidden');
        }

        // Función para enviar pedido con TALLA SELECCIONADA + FOTO ACTIVA
        function enviarPedidoWhatsApp(idx) {
            const prod = productosData[idx];
            if (!prod) return;

            const selectorTalla = document.getElementById(`select-talla-${idx}`);
            const tallaSeleccionada = selectorTalla ? selectorTalla.value : 'No especificada';

            const imgElement = document.getElementById(`img-prod-${idx}`);
            const fotoActivaUrl = imgElement ? imgElement.src : obtenerArrayFotos(prod)[0];

            const precioUsd = Number(prod.precio_usd) || 0;
            const precioBs = precioUsd * Number(tasaBCV);
            const precioBsFormateado = precioBs.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            const mensajeWS = `¡Hola Soufflé VE! Me interesa comprar el modelo: *${prod.nombre}* | Marca: ${prod.marca || 'N/A'} | Talla seleccionada: ${tallaSeleccionada} | Precio: $${precioUsd} / Bs. ${precioBsFormateado} | Foto del producto: ${fotoActivaUrl}`;

            const urlWS = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent(mensajeWS)}`;
            window.open(urlWS, '_blank');
        }

        function renderizarProductos(lista) {
            const grilla = document.getElementById('grilla-productos');
            const contador = document.getElementById('contador-productos');

            contador.innerText = `${lista.length} modelo(s) disponible(s)`;

            if (lista.length === 0) {
                grilla.innerHTML = `<p class="col-span-full text-center text-gray-500 py-12">No se encontraron productos que coincidan con tu búsqueda.</p>`;
                return;
            }

            grilla.innerHTML = lista.map((prod, index) => {
                const precioUsd = Number(prod.precio_usd) || 0;
                const precioBs = precioUsd * Number(tasaBCV);
                const precioBsFormateado = precioBs.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                const fotos = obtenerArrayFotos(prod);
                const listaTallas = prod.tallas ? String(prod.tallas).split(',').map(t => t.trim()).filter(Boolean) : ['Única'];

                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition duration-200">
                        <div>
                            <!-- CONTENEDOR DE FOTO CON ZOOM Y BOTONES DE ÁNGULO -->
                            <div class="relative bg-white border-b border-gray-50">
                                <div class="h-64 overflow-hidden flex items-center justify-center p-3 cursor-pointer group" onclick="abrirZoom(${index})" title="Haz clic para ampliar">
                                    <img id="img-prod-${index}" src="${fotos[0]}" alt="${prod.nombre}" class="max-h-full max-w-full object-contain transition transform group-hover:scale-105 duration-200">
                                    <span class="absolute bottom-2 right-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-md opacity-0 group-hover:opacity-100 transition">🔍 Zoom</span>
                                </div>
                                ${prod.destacado ? `<span class="absolute top-3 left-3 bg-red-500 text-white text-[10px] font-black uppercase px-2 py-1 rounded-md tracking-wider shadow-sm pointer-events-none">🔥 Destacado</span>` : ''}
                                
                                <!-- BOTONES SELECTORES DE FOTOS (FRENTE, ESPALDA, ETC.) -->
                                ${fotos.length > 1 ? `
                                    <div id="botones-fotos-${index}" class="absolute bottom-3 left-3 flex gap-1.5 bg-white/90 backdrop-blur-sm p-1 rounded-xl shadow-sm border border-gray-200">
                                        ${fotos.map((f, fIdx) => `
                                            <button onclick="event.stopPropagation(); cambiarFoto(${index}, '${f}', this)" class="w-7 h-7 rounded-lg text-xs font-bold border ${fIdx === 0 ? 'border-black bg-black text-white shadow-sm' : 'border-gray-300 bg-white text-gray-700 hover:bg-gray-100'} transition" title="Ver foto ${fIdx + 1}">
                                                ${fIdx + 1}
                                            </button>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>

                            <div class="p-4">
                                <span class="text-[10px] font-black uppercase text-gray-400 tracking-wider block mb-1">${prod.marca || 'GENÉRICO'}</span>
                                <h3 class="font-bold text-gray-900 text-base leading-snug mb-3">${prod.nombre || 'Producto'}</h3>
                                
                                <!-- SELECTOR DE TALLA INTERACTIVO -->
                                <div class="mb-4">
                                    <label for="select-talla-${index}" class="block text-[11px] font-bold text-gray-500 uppercase mb-1">
                                        Selecciona tu Talla:
                                    </label>
                                    <select id="select-talla-${index}" class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-xs rounded-lg p-2 font-semibold focus:ring-2 focus:ring-black focus:border-transparent outline-none">
                                        ${listaTallas.map(talla => `<option value="${talla}">Talla: ${talla}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="p-4 pt-0 border-t border-gray-50 mt-auto">
                            <div class="flex justify-between items-end my-3">
                                <div>
                                    <span class="text-2xl font-black text-gray-900">$${precioUsd}</span>
                                    <span class="text-[10px] text-gray-400 uppercase font-bold block">Tasa BCV</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-sm font-bold text-gray-700 block">Bs. ${precioBsFormateado}</span>
                                </div>
                            </div>
                            <button onclick="enviarPedidoWhatsApp(${index})" class="w-full bg-black hover:bg-gray-800 text-white font-bold text-sm py-2.5 rounded-xl flex items-center justify-center gap-2 transition duration-200">
                                <span>Pedir por WhatsApp</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Cargar datos al iniciar
        cargarDatos();
    </script>
</body>
</html>
