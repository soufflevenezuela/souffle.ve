@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#241C16; --surface:#30261E; --ink:#EFE4D3; --brand:#CBA98C; --tan:#8C7561;
    --line:#46382C; --on-brand:#241C16; --scrim:rgba(8,5,3,.62); --soft:rgba(36,28,22,.88);
    --hot-bg:#6A5140; --hot-ink:#F6ECDD; --hot-sub:rgba(246,236,221,.82);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#241C16; --surface:#30261E; --ink:#EFE4D3; --brand:#CBA98C; --tan:#8C7561;
  --line:#46382C; --on-brand:#241C16; --scrim:rgba(8,5,3,.62); --soft:rgba(36,28,22,.88);
    --hot-bg:#6A5140; --hot-ink:#F6ECDD; --hot-sub:rgba(246,236,221,.82);
}
*,*::before,*::after{box-sizing:inherit}
html{
  background:var(--bg);
  scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-weight:300; font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* logo (mask so it follows the theme) */
.logo{
  display:block; background:var(--brand); aspect-ratio:640/251;
  -webkit-mask:var(--logo) center/contain no-repeat; mask:var(--logo) center/contain no-repeat;
}

/* header */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30; height:56px;
  background:var(--bg); border-bottom:1px solid var(--line);
}
@supports (background: color-mix(in srgb, red 50%, transparent)){
  .top{background:color-mix(in srgb, var(--bg) 90%, transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
}
.top .wrap{height:100%;display:flex;align-items:center;justify-content:space-between}
.top .logo{width:78px}
.bag{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 12px;
  font-size:.82rem;letter-spacing:.04em;
}
.bag svg{width:20px;height:20px;stroke:var(--brand);fill:none;stroke-width:1.4}
.count{
  min-width:22px;height:22px;border-radius:11px;padding:0 6px;background:var(--brand);color:var(--on-brand);
  font-size:.72rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;
}
.count[data-n="0"]{background:transparent;color:var(--brand);border:1px solid var(--line)}
.count.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.28)}}

/* hero */
.hero{padding:54px 20px 30px;text-align:center}
.hero .logo{width:min(300px,68vw);margin:0 auto 26px}
.hero h1{
  margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(2rem,6.2vw,3.1rem);line-height:1.1;color:var(--ink);
}
.hero h1 em{display:block;color:var(--brand)}
.hero p{margin:18px auto 0;max-width:34ch;color:var(--ink)}
.hero hr{width:28px;border:0;border-top:1px solid var(--brand);margin:22px auto 0}

/* filters */
.filters{
  position:sticky; top:calc(env(safe-area-inset-top,0px) + 56px); z-index:20;
  background:var(--bg); padding:12px 0; border-bottom:1px solid var(--line);
}
@supports (background: color-mix(in srgb, red 50%, transparent)){
  .filters{background:color-mix(in srgb, var(--bg) 92%, transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;min-height:40px;padding:0 18px;border:1px solid var(--line);border-radius:20px;
  font-size:.84rem;white-space:nowrap;transition:background .2s,color .2s,border-color .2s;
}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

/* sections + grid */
main{padding-bottom:110px}
.sec{padding-top:44px}
.sec[hidden]{display:none}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:22px}
.sec-head h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.65rem;line-height:1.2}
.sec-head span{font-size:.8rem;color:var(--brand);text-align:right;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 20px}}
@media (min-width:1020px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.card{display:block;width:100%;text-align:left}
.item{list-style:none}
.item .meta{cursor:pointer}
.sw{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sw button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;padding:0}
.sw button i{display:block;width:20px;height:20px;border-radius:50%;background:var(--c);border:1px solid var(--line);transition:transform .15s}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--brand)}
@media (hover:hover){.sw button:hover i{transform:scale(1.12)}}
.sw.big button{width:40px;height:40px}
.sw.big button i{width:28px;height:28px}
.sw + .meta{padding-top:6px}
.ph{position:relative;aspect-ratio:2/3;background:var(--surface);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;opacity:1;transition:transform .5s ease,opacity .15s ease}
@media (hover:hover){.item:hover .ph img{transform:scale(1.035)}}
.plus{
  position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;
  background:var(--soft);display:grid;place-items:center;
}
.plus svg{width:14px;height:14px;stroke:var(--brand);stroke-width:1.5;fill:none}
.views{
  position:absolute;left:10px;bottom:10px;padding:2px 9px;border-radius:12px;background:var(--soft);
  font-size:.7rem;color:var(--ink);
}
.card.off .ph img{filter:grayscale(.7) opacity(.55)}
.off-tag{position:absolute;inset:auto 0 50% 0;text-align:center;font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--ink)}
.meta{padding-top:12px}
.meta .n{font-family:var(--serif);font-size:1rem;line-height:1.3;color:var(--ink)}
.meta .v{margin-top:2px;font-size:.82rem;color:var(--brand)}
.meta .p{margin-top:6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.meta .usd{font-family:var(--serif);font-size:1.05rem;color:var(--ink)}
.meta .bs{font-size:.76rem;color:var(--brand)}
.rate{margin:24px auto 0;max-width:460px;padding:12px 18px;border-radius:10px;background:var(--surface);font-size:.8rem;line-height:1.5}
.rate strong{font-weight:500}
.price{margin-top:14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.price .usd{font-family:var(--serif);font-size:1.6rem;color:var(--ink)}
.price .bs{font-size:.92rem;color:var(--brand)}
.price-note{margin:4px 0 0;font-size:.74rem;color:var(--brand)}
.line .pr{font-size:.8rem;color:var(--ink);margin-top:2px}
.sum.big{font-size:.95rem}
.sum small{display:block;text-align:right;font-size:.76rem;color:var(--brand)}

/* price helpers */
.old{color:var(--brand);text-decoration:line-through;text-decoration-thickness:1px;font-size:.82rem;opacity:.85}
.price .old{font-size:1.05rem}

/* producto hot */
.hotwrap{padding-top:4px;padding-bottom:18px}
.hot{
  display:grid;grid-template-columns:minmax(118px,40%) 1fr;gap:18px;align-items:center;
  background:var(--hot-bg);color:var(--hot-ink);border-radius:14px;padding:14px;
}
@media (min-width:720px){.hot{max-width:800px;margin:0 auto;grid-template-columns:270px 1fr;gap:38px;padding:24px}}
.hot-ph{display:block;width:100%;text-align:left}
.hot .ph{border-radius:8px}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:3px 11px 3px 8px;border-radius:14px;
  background:var(--hot-ink);color:var(--hot-bg);font-size:.76rem;font-weight:500;
}
.badge svg{width:14px;height:14px;fill:currentColor}
.best{display:block;margin-top:8px;font-size:.8rem;color:var(--hot-sub)}
.hot h2{margin:6px 0 0;font-family:var(--serif);font-weight:400;font-size:clamp(1.25rem,4.8vw,1.95rem);line-height:1.2;color:var(--hot-ink)}
.hv{margin-top:3px;font-family:var(--serif);font-style:italic;color:var(--hot-sub)}
.hot .sw{margin-top:10px}
.hot .sw button i{border-color:rgba(251,244,232,.5)}
.hot .sw button[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--hot-ink)}
.hp{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-top:12px}
.hp .now{font-family:var(--serif);font-size:2.1rem;line-height:1;color:var(--hot-ink)}
.hp s{color:var(--hot-sub);text-decoration-thickness:1.5px}
.hp .pct{padding:2px 9px;border-radius:10px;background:var(--hot-ink);color:var(--hot-bg);font-size:.74rem;font-weight:500}
.hbs{margin-top:4px;font-size:.84rem;color:var(--hot-sub)}
.hot-btn{margin-top:14px;min-height:46px;padding:0 24px;border-radius:24px;background:var(--hot-ink);color:var(--hot-bg);font-size:.9rem;font-weight:400}
.hot :focus-visible{outline-color:var(--hot-ink)}

/* hilera horizontal de jeans */
.rail-wrap{position:relative}
.rail{
  display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;
  margin:0 -20px;padding:2px 20px 8px;list-style:none;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.rail::-webkit-scrollbar{display:none}
.rail > li{flex:0 0 clamp(150px,43vw,240px);scroll-snap-align:start}
.rail-btn{
  position:absolute;z-index:3;top:calc(clamp(150px,43vw,240px) * .75 - 22px);width:44px;height:44px;border-radius:50%;
  background:var(--soft);display:grid;place-items:center;box-shadow:0 2px 14px rgba(40,26,16,.22);
  transition:opacity .2s;
}
.rail-btn svg{width:18px;height:18px;stroke:var(--ink);stroke-width:1.6;fill:none}
.rail-btn.prev{left:-8px}.rail-btn.next{right:-8px}
@media (min-width:1200px){.rail-btn.prev{left:-24px}.rail-btn.next{right:-24px}}
.rail-btn:disabled{opacity:0;pointer-events:none}
.rail-hint{margin:-8px 0 14px;font-size:.78rem;color:var(--brand)}

/* overlay base */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}

/* product sheet */
.sheet{
  position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:94dvh;max-height:94vh;
  background:var(--bg);border-radius:18px 18px 0 0;overflow:auto;overscroll-behavior:contain;
  transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;
}
.sheet.on{transform:none;visibility:visible}
@supports (height:1dvh){.sheet{max-height:94dvh}}
.sheet-in{display:grid;gap:18px;padding:18px 20px 26px}
.x{
  position:absolute;top:10px;right:10px;z-index:2;width:44px;height:44px;border-radius:50%;
  background:var(--soft);display:grid;place-items:center;
}
.x svg{width:16px;height:16px;stroke:var(--ink);stroke-width:1.5;fill:none}
.gal{display:grid;gap:10px;justify-items:center}
.main-ph{aspect-ratio:2/3;width:min(100%,calc(42vh * 2 / 3));background:var(--surface);overflow:hidden}
@supports (height:1dvh){.main-ph{width:min(100%,calc(42dvh * 2 / 3))}}
.main-ph img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;justify-content:center}
.th{width:48px;aspect-ratio:2/3;border:1px solid transparent;opacity:.6;overflow:hidden;background:var(--surface)}
.th img{width:100%;height:100%;object-fit:cover}
.th[aria-current="true"]{border-color:var(--brand);opacity:1}
.info h3{margin:0;font-family:var(--serif);font-weight:400;font-size:1.55rem;line-height:1.2}
.info .v{margin-top:4px;font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--brand)}
.lbl{margin:22px 0 10px;font-size:.84rem;color:var(--ink);display:flex;justify-content:space-between;gap:10px}
.lbl small{font-size:.76rem;color:var(--brand)}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{
  min-width:52px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:22px;font-size:.88rem;
  transition:background .2s,color .2s,border-color .2s;
}
.size[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:22px}
.qty button{width:44px;height:44px;font-size:1.2rem;color:var(--brand)}
.qty output{min-width:30px;text-align:center;font-weight:400}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;margin-top:22px;
  background:var(--brand);color:var(--on-brand);border-radius:26px;font-size:.92rem;font-weight:400;letter-spacing:.02em;
  text-decoration:none;transition:opacity .2s;
}
.btn:hover{opacity:.9}
.btn[aria-disabled="true"],.btn:disabled{opacity:.38;pointer-events:none}
.btn svg{width:20px;height:20px;fill:currentColor}
.hint{margin:10px 0 0;font-size:.78rem;color:var(--brand);min-height:1.2em}
@media (min-width:820px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(940px,92vw);max-height:90vh;border-radius:6px;
    transform:translate(-50%,-46%);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .sheet-in{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;padding:36px;align-items:start}
  .main-ph{width:100%}
  .gal{justify-items:stretch}
  .thumbs{justify-content:flex-start}
  .info{padding-top:18px}
}

/* cart drawer */
.drawer{
  position:fixed;z-index:60;top:0;bottom:0;right:0;width:min(440px,100vw);background:var(--bg);
  display:flex;flex-direction:column;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding-top:env(safe-area-inset-top,0px);visibility:hidden;border-left:1px solid var(--line);
}
.drawer.on{transform:none;visibility:visible}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 14px 22px;border-bottom:1px solid var(--line)}
.d-head h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.45rem}
.d-head .x{position:static}
.d-body{flex:1;overflow:auto;padding:6px 22px;overscroll-behavior:contain}
.empty{padding:60px 10px;text-align:center}
.empty p{margin:0 0 6px}
.empty .big{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--brand)}
.line{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.line .t{aspect-ratio:2/3;background:var(--surface);overflow:hidden}
.line .t img{width:100%;height:100%;object-fit:cover}
.line .n{font-family:var(--serif);font-size:.98rem;line-height:1.3}
.line .d{font-size:.8rem;color:var(--brand);margin-top:2px}
.line .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.line .qty button{width:38px;height:38px}
.rm{font-size:.78rem;color:var(--brand);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 4px}
.d-foot{padding:16px 22px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:.78rem;color:var(--brand);margin-bottom:4px}
.field input,.field textarea{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid transparent;
  border-radius:8px;padding:10px 12px;resize:none;
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.sum{display:flex;justify-content:space-between;margin:6px 0 0;font-size:.88rem}
.d-foot .btn{margin-top:12px}
.clear{display:block;margin:6px auto 0;font-size:.78rem;color:var(--brand);text-decoration:underline;text-underline-offset:3px;min-height:40px}

/* floating bar */
.fab{
  position:fixed;z-index:40;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);
  width:min(420px,calc(100vw - 28px));min-height:52px;border-radius:26px;background:var(--brand);color:var(--on-brand);
  display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:.9rem;font-weight:400;
  transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 8px 30px rgba(40,26,16,.25);
}
.fab.on{transform:translate(-50%,0)}

/* toast */
.toast{
  position:fixed;z-index:80;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-14px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:.84rem;pointer-events:none;
  transition:opacity .25s,transform .25s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

footer{border-top:1px solid var(--line);padding:38px 0 120px;text-align:center}
footer .logo{width:96px;margin:0 auto 14px}
footer p{margin:0;font-size:.8rem;color:var(--brand)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}

/* ===== añadidos para esta página ===== */
.bag.wa{text-decoration:none;color:var(--ink)}
.bag.wa svg{fill:var(--brand);stroke:none}
.search{position:relative;max-width:460px;margin:16px auto 0}
.search input{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid transparent;border-radius:24px;padding:12px 46px 12px 18px;
}
.search input::placeholder{color:var(--brand);opacity:.85}
.search input:focus{outline:none;border-color:var(--brand)}
.search button{
  position:absolute;right:2px;top:0;height:100%;width:44px;display:grid;place-items:center;color:var(--brand);font-size:1rem;
}
.search button[hidden]{display:none}
.tagd{
  position:absolute;left:10px;top:10px;padding:2px 10px;border-radius:12px;background:var(--hot-bg);color:var(--hot-ink);
  font-size:.7rem;font-weight:500;
}
.main-ph{cursor:zoom-in}
.state{padding:70px 10px;text-align:center;color:var(--brand)}
.state .big{display:block;font-family:var(--serif);font-style:italic;font-size:1.3rem;margin-bottom:6px}
.state .retry{
  margin-top:16px;min-height:44px;padding:0 24px;border-radius:24px;background:var(--brand);color:var(--on-brand);font-size:.9rem;
}
.zoom{
  position:fixed;inset:0;z-index:90;background:rgba(10,6,3,.94);display:flex;align-items:center;justify-content:center;
  padding:18px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;cursor:zoom-out;
}
.zoom.on{opacity:1;visibility:visible}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.zoom .x{top:calc(10px + env(safe-area-inset-top,0px))}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a href="#top" aria-label="Soufflé, inicio" style="display:block"><span class="logo" role="img" aria-label="Soufflé"></span></a>
    <a class="bag wa" id="waTop" href="#" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.25-1.5A9.9 9.9 0 1 0 12.04 2Zm0 1.8a8.1 8.1 0 1 1-4.2 15l-.3-.18-3.1.88.9-3-.2-.32A8.1 8.1 0 0 1 12.04 3.8Zm-3.2 4.2c-.18 0-.47.07-.72.34-.25.27-.95.93-.95 2.27s.97 2.64 1.1 2.82c.14.18 1.9 3.02 4.7 4.1 2.3.9 2.77.72 3.27.67.5-.04 1.6-.65 1.83-1.29.22-.63.22-1.17.15-1.29-.07-.11-.25-.18-.52-.31-.27-.14-1.6-.79-1.85-.88-.25-.09-.43-.14-.61.14-.18.27-.7.88-.86 1.06-.16.18-.32.2-.59.07-.27-.14-1.15-.42-2.2-1.35-.81-.72-1.36-1.62-1.52-1.89-.16-.27-.02-.42.12-.56.12-.12.27-.32.4-.48.14-.16.18-.27.27-.45.09-.18.05-.34-.02-.48-.07-.14-.6-1.5-.84-2.05-.22-.52-.45-.45-.61-.46h-.52Z"/></svg>
      WhatsApp
    </a>
  </div>
</header>

<div id="top" class="wrap hero">
  <span class="logo" role="img" aria-label="Soufflé"></span>
  <h1>Colección <em>disponible</em></h1>
  <p>Elige tu prenda, marca tu talla y haz tu pedido por WhatsApp. Enviamos a todo el país.</p>
  <div class="rate" id="rateBox">Cargando tasa del BCV…</div>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar prenda o categoría" aria-label="Buscar prenda" autocomplete="off">
    <button id="qClear" type="button" aria-label="Borrar búsqueda" hidden>✕</button>
  </div>
</div>

<nav class="filters" aria-label="Categorías">
  <div class="wrap"><div class="chips" id="chips"></div></div>
</nav>

<main class="wrap" id="catalog">
  <p class="state">Cargando colección…</p>
</main>

<footer>
  <span class="logo" role="img" aria-label="Soufflé"></span>
  <p>Precios a la tasa oficial del BCV. Pagos en Bs. y divisas. Tu pedido se confirma por WhatsApp.</p>
</footer>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="pName" tabindex="-1">
  <button class="x" id="closeSheet" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <div class="sheet-in">
    <div class="gal">
      <div class="main-ph" id="mainPh" title="Toca para ampliar"><img id="pMain" alt=""></div>
      <div class="thumbs" id="pThumbs"></div>
    </div>
    <div class="info">
      <h3 id="pName"></h3>
      <div class="v" id="pVar"></div>
      <div class="price"><span class="usd" id="pUsd"></span><span class="bs" id="pBs"></span></div>
      <p class="price-note" id="pNote"></p>
      <div class="lbl"><span id="sizeLbl">Talla</span></div>
      <div class="sizes" id="pSizes" role="group" aria-labelledby="sizeLbl"></div>
      <button class="btn" id="order" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.25-1.5A9.9 9.9 0 1 0 12.04 2Zm0 1.8a8.1 8.1 0 1 1-4.2 15l-.3-.18-3.1.88.9-3-.2-.32A8.1 8.1 0 0 1 12.04 3.8Zm-3.2 4.2c-.18 0-.47.07-.72.34-.25.27-.95.93-.95 2.27s.97 2.64 1.1 2.82c.14.18 1.9 3.02 4.7 4.1 2.3.9 2.77.72 3.27.67.5-.04 1.6-.65 1.83-1.29.22-.63.22-1.17.15-1.29-.07-.11-.25-.18-.52-.31-.27-.14-1.6-.79-1.85-.88-.25-.09-.43-.14-.61.14-.18.27-.7.88-.86 1.06-.16.18-.32.2-.59.07-.27-.14-1.15-.42-2.2-1.35-.81-.72-1.36-1.62-1.52-1.89-.16-.27-.02-.42.12-.56.12-.12.27-.32.4-.48.14-.16.18-.27.27-.45.09-.18.05-.34-.02-.48-.07-.14-.6-1.5-.84-2.05-.22-.52-.45-.45-.61-.46h-.52Z"/></svg>
        Pedir por WhatsApp
      </button>
      <p class="hint" id="pHint" role="status"></p>
    </div>
  </div>
</section>

<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <button class="x" id="closeZoom" aria-label="Cerrar foto"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <img id="zoomImg" alt="">
</div>

<script>
/* ============ CONFIGURACIÓN ============ */
const API_URL = "https://script.google.com/macros/s/AKfycbzukNs5x0ohnZ3mSD8YIaZILFtdo-hgZ3utYswJ64uxznXWq48qd_A-_wmhJsMgIc5Q/exec";
const TELEFONO_WHATSAPP = "584243566603";

const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600"><rect width="400" height="600" fill="#EADFCF"/>' +
  '<text x="200" y="305" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#B39880">Sin imagen</text></svg>'
);

/* ============ UTILIDADES ============ */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("de-DE", {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtUsd = n => "$" + (Number.isInteger(n) ? n : nf.format(n));
const fmtBs = usd => "Bs " + nf.format(usd * tasaBCV);

let productos = [];   // productos ya normalizados
let tasaBCV = 0;
let filtro = "todo";
let busqueda = "";
let sel = {p:null, size:null, img:0};
let lastFocus = null;

function limpiarUrlUnica(urlRaw) {
  if (!urlRaw) return "";
  const s = String(urlRaw);
  const matchImg = s.match(/\[img\](.*?)\[\/img\]/i);
  if (matchImg && matchImg[1]) return matchImg[1].trim();
  const matchUrl = s.match(/\[url=(.*?)\]/i);
  if (matchUrl && matchUrl[1]) return matchUrl[1].trim();
  const matchSrc = s.match(/src=["'](.*?)["']/i);
  if (matchSrc && matchSrc[1]) return matchSrc[1].trim();
  return s.replace(/\[\/?(url|img).*?\]/gi, "").trim();
}

function obtenerArrayFotos(prod) {
  const fotos = [];
  for (const key in prod) {
    const valor = prod[key];
    if (!valor) continue;
    const limpia = limpiarUrlUnica(valor);
    if (!limpia || !limpia.startsWith("http") || fotos.includes(limpia)) continue;
    const k = key.toLowerCase();
    if (k.includes("precio") || k.includes("talla") || k.includes("id") || k.includes("marca") ||
        k.includes("categoria") || k.includes("nombre") || k.includes("destacado")) continue;
    if (k.includes("imagen_url") || k === "imagen" || k === "foto") fotos.unshift(limpia);
    else fotos.push(limpia);
  }
  if (fotos.length === 0) fotos.push(PLACEHOLDER);
  return fotos;
}

function normalizar(prod, i) {
  const tallas = prod.tallas ? String(prod.tallas).split(",").map(t => t.trim()).filter(Boolean) : [];
  return {
    i,
    nombre: prod.nombre ? String(prod.nombre).trim() : "Producto",
    categoria: prod.categoria ? String(prod.categoria).trim() : "General",
    marca: prod.marca ? String(prod.marca).trim() : "",
    tallas: tallas.length ? tallas : ["Única"],
    precio: Number(prod.precio_usd) || 0,
    destacado: !!prod.destacado,
    fotos: obtenerArrayFotos(prod)
  };
}

const rateTxt = () => "Bs " + nf.format(tasaBCV);
const precioHtml = p => p.precio > 0
  ? `<span class="usd">${fmtUsd(p.precio)}</span>` + (tasaBCV ? `<span class="bs">${fmtBs(p.precio)}</span>` : "")
  : `<span class="bs">Consultar precio</span>`;

/* ============ CARGA DE DATOS ============ */
async function cargarDatos() {
  $("#catalog").innerHTML = `<p class="state">Cargando colección…</p>`;
  try {
    const response = await fetch(API_URL, {method:"GET", redirect:"follow"});
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    tasaBCV = Number(data.tasa_bcv || data.tasa || 0);
    productos = (data.productos || []).map(normalizar);
    renderRate();
    renderChips();
    renderCatalog();
  } catch (error) {
    console.error("Error al cargar los productos:", error);
    renderRate();
    $("#catalog").innerHTML = `<div class="state"><span class="big">No pudimos cargar la colección</span>Revisa tu conexión e inténtalo de nuevo.<br><button class="retry" id="retry" type="button">Reintentar</button></div>`;
  }
}

function renderRate() {
  $("#rateBox").innerHTML = tasaBCV
    ? `Precios en dólares y en bolívares a la tasa oficial del BCV.<br><strong>${rateTxt()} por US$ 1</strong>`
    : `Precios en dólares. La tasa del BCV no está disponible en este momento.`;
}

/* ============ CATÁLOGO ============ */
function categorias() { return [...new Set(productos.map(p => p.categoria))]; }

function renderChips() {
  const items = [{id:"todo", title:"Todo"}].concat(categorias().map(c => ({id:c, title:c})));
  $("#chips").innerHTML = items.map(it =>
    `<button class="chip" type="button" data-f="${esc(it.id)}" aria-pressed="${filtro === it.id}">${esc(it.title)}</button>`).join("");
}

function filtrados() {
  const q = busqueda.toLowerCase();
  return productos.filter(p =>
    (filtro === "todo" || p.categoria === filtro) &&
    (!q || p.nombre.toLowerCase().includes(q) || p.marca.toLowerCase().includes(q) || p.categoria.toLowerCase().includes(q)));
}

function tarjeta(p) {
  const vistas = p.fotos.length > 1 ? `<span class="views">${p.fotos.length} vistas</span>` : "";
  const dest = p.destacado ? `<span class="tagd">Destacado</span>` : "";
  return `<li class="item" data-i="${p.i}">
    <button class="card" type="button" aria-label="${esc(p.nombre)}, ver detalles">
      <div class="ph"><img src="${esc(p.fotos[0])}" alt="${esc(p.nombre)}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src=PLACEHOLDER">${dest}${vistas}<span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></span></div>
    </button>
    <div class="meta"><div class="n">${esc(p.nombre)}</div>${p.marca ? `<div class="v">${esc(p.marca)}</div>` : ""}
      <div class="p">${precioHtml(p)}</div></div>
  </li>`;
}

function renderCatalog() {
  const lista = filtrados();
  if (!productos.length) {
    $("#catalog").innerHTML = `<div class="state"><span class="big">Aún no hay prendas disponibles</span>Vuelve pronto, estamos actualizando la colección.</div>`;
    return;
  }
  if (!lista.length) {
    $("#catalog").innerHTML = `<div class="state"><span class="big">Sin resultados</span>Prueba con otra palabra o elige otra categoría.</div>`;
    return;
  }
  $("#catalog").innerHTML = categorias().map(cat => {
    const items = lista.filter(p => p.categoria === cat);
    if (!items.length) return "";
    return `<section class="sec">
      <div class="sec-head"><h2>${esc(cat)}</h2><span>${items.length} ${items.length === 1 ? "modelo" : "modelos"}</span></div>
      <ul class="grid" style="list-style:none;margin:0;padding:0">${items.map(tarjeta).join("")}</ul>
    </section>`;
  }).join("");
}

/* ============ FICHA DE PRODUCTO ============ */
function lockScroll(on) { document.body.style.overflow = on ? "hidden" : ""; }
function setScrim(on) { $("#scrim").classList.toggle("on", on); }

function openSheet(i, trigger) {
  const p = productos[i];
  if (!p) return;
  lastFocus = trigger || document.activeElement;
  sel = {p, size: p.tallas.length === 1 ? p.tallas[0] : null, img: 0};
  $("#pName").textContent = p.nombre;
  $("#pVar").textContent = [p.marca, p.categoria].filter(Boolean).join(" · ");
  $("#pUsd").textContent = p.precio > 0 ? fmtUsd(p.precio) : "Consultar precio";
  $("#pBs").textContent = p.precio > 0 && tasaBCV ? fmtBs(p.precio) : "";
  $("#pNote").textContent = tasaBCV ? `Tasa BCV: ${rateTxt()} por US$ 1` : "";
  $("#pSizes").innerHTML = p.tallas.map(t =>
    `<button class="size" type="button" data-s="${esc(t)}" aria-pressed="${sel.size === t}">${esc(t)}</button>`).join("");
  $("#pHint").textContent = "";
  setImg(0);
  $("#sheet").classList.add("on"); setScrim(true); lockScroll(true);
  $("#sheet").scrollTop = 0;
  setTimeout(() => $("#closeSheet").focus(), 50);
}

function setImg(n) {
  const p = sel.p;
  sel.img = n;
  const main = $("#pMain");
  main.onerror = () => { main.onerror = null; main.src = PLACEHOLDER; };
  main.src = p.fotos[n];
  main.alt = p.nombre + (p.fotos.length > 1 ? `, vista ${n + 1}` : "");
  $("#pThumbs").innerHTML = p.fotos.length > 1 ? p.fotos.map((f, j) =>
    `<button class="th" type="button" data-i="${j}" aria-label="Vista ${j + 1}" aria-current="${j === n}"><img src="${esc(f)}" alt="" onerror="this.onerror=null;this.src=PLACEHOLDER"></button>`).join("") : "";
}

function closeSheet() {
  $("#sheet").classList.remove("on");
  setScrim(false); lockScroll(false);
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function abrirZoom() {
  if (!sel.p) return;
  $("#zoomImg").src = sel.p.fotos[sel.img];
  $("#zoomImg").alt = sel.p.nombre;
  $("#zoom").classList.add("on");
}
function cerrarZoom() { $("#zoom").classList.remove("on"); }

/* swipe sobre la foto principal */
(function () {
  const el = $("#mainPh");
  let x0 = 0, moved = false;
  el.addEventListener("touchstart", e => { x0 = e.changedTouches[0].screenX; moved = false; }, {passive:true});
  el.addEventListener("touchend", e => {
    const d = x0 - e.changedTouches[0].screenX;
    if (!sel.p || sel.p.fotos.length < 2 || Math.abs(d) < 40) return;
    moved = true;
    const n = sel.p.fotos.length;
    setImg((sel.img + (d > 0 ? 1 : -1) + n) % n);
  }, {passive:true});
  el.addEventListener("click", () => { if (moved) { moved = false; return; } abrirZoom(); });
})();

/* ============ PEDIDO POR WHATSAPP ============ */
function waBase() { return `https://wa.me/${TELEFONO_WHATSAPP.replace(/\D/g, "")}`; }

function mensajePedido() {
  const p = sel.p, foto = p.fotos[sel.img];
  const l = [`¡Hola Soufflé VE! Quiero pedir esta prenda:`, "", `*${p.nombre}*`];
  l.push(`Categoría: ${p.categoria}`);
  if (p.marca) l.push(`Marca: ${p.marca}`);
  l.push(`Talla: ${sel.size}`);
  if (p.precio > 0) l.push(`Precio: ${fmtUsd(p.precio)}` + (tasaBCV ? ` / ${fmtBs(p.precio)} (tasa BCV ${rateTxt()})` : ""));
  if (foto && foto.startsWith("http")) l.push(`Foto: ${foto}`);
  l.push("", "¿Me confirman disponibilidad? Gracias.");
  return l.join("\n");
}

$("#order").addEventListener("click", () => {
  if (!sel.p) return;
  if (!sel.size) { $("#pHint").textContent = "Elige una talla para continuar."; return; }
  const url = `${waBase()}?text=${encodeURIComponent(mensajePedido())}`;
  if (!window.open(url, "_blank", "noopener")) window.location.href = url;
});

$("#waTop").href = `${waBase()}?text=${encodeURIComponent("¡Hola Soufflé VE! Quisiera hacer una consulta sobre la colección disponible.")}`;

/* ============ EVENTOS ============ */
document.addEventListener("click", e => {
  if (e.target.closest("#retry")) { cargarDatos(); return; }
  const chip = e.target.closest(".chip");
  if (chip) {
    filtro = chip.dataset.f;
    renderChips(); renderCatalog();
    window.scrollTo({top: document.querySelector(".filters").offsetTop - 56, behavior:"smooth"});
    return;
  }
  const item = e.target.closest(".item");
  if (item) openSheet(+item.dataset.i, item.querySelector(".card"));
});

$("#pSizes").addEventListener("click", e => {
  const b = e.target.closest(".size");
  if (!b) return;
  sel.size = b.dataset.s;
  document.querySelectorAll("#pSizes .size").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  $("#pHint").textContent = "";
});
$("#pThumbs").addEventListener("click", e => { const b = e.target.closest(".th"); if (b) setImg(+b.dataset.i); });
$("#closeSheet").onclick = closeSheet;
$("#scrim").onclick = closeSheet;
$("#zoom").onclick = cerrarZoom;

const inputQ = $("#q"), btnQ = $("#qClear");
inputQ.addEventListener("input", () => {
  busqueda = inputQ.value.trim();
  btnQ.hidden = !inputQ.value;
  renderCatalog();
});
btnQ.onclick = () => { inputQ.value = ""; busqueda = ""; btnQ.hidden = true; renderCatalog(); inputQ.focus(); };

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if ($("#zoom").classList.contains("on")) cerrarZoom();
    else if ($("#sheet").classList.contains("on")) closeSheet();
  }
  if (e.key === "Tab" && $("#sheet").classList.contains("on") && !$("#zoom").classList.contains("on")) {
    const f = [...$("#sheet").querySelectorAll("button,a[href]")].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ============ INICIO ============ */
cargarDatos();
</script>
</body>
</html>
