<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soufflé VE - Catálogo 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuentes Elegantes Estilo Catálogo -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #F7F4EF; /* Fondo crema cálido inspirado en el catálogo[cite: 1, 2] */
            color: #4A3B32;
        }
        .font-brand {
            font-family: 'Cormorant Garamond', serif;
        }
    </style>
</head>
<body class="antialiased">

    <!-- === CONFIGURACIÓN DE TUS DATOS === -->
    <script>
        // URL DE GOOGLE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbzukNs5x0ohnZ3mSD8YIaZILFtdo-hgZ3utYswJ64uxznXWq48qd_A-_wmhJsMgIc5Q/exec"; 
        
        // NÚMERO DE WHATSAPP
        const TELEFONO_WHATSAPP = "584243566603";
    </script>

    <!-- BARRA SUPERIOR DE NOTIFICACIÓN -->
    <div class="bg-[#3D2E25] text-[#F7F4EF] text-xs sm:text-sm py-2 px-4 flex flex-col sm:flex-row justify-between items-center gap-1 border-b border-[#524034]">
        <div>
            <span>Pedidos directos por <strong class="text-[#D4A373]">WhatsApp</strong> | Envíos a todo el país</span>
        </div>
        <div class="flex items-center gap-2">
            <span>Tasa Oficial BCV: <strong id="tasa-bcv-display" class="text-[#E9D8A6]">Cargando...</strong></span>
            <span>•</span>
            <span>Pagos en Bs. y Divisas</span>
        </div>
    </div>

    <!-- ENCABEZADO PRINCIPAL (SOUFFLÉ VE) -->
    <header class="bg-[#F7F4EF] shadow-sm sticky top-0 z-50 border-b border-[#E6E0D5]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3">
                <!-- LOGO DE LA TIENDA -->
                <div class="w-11 h-11 rounded-xl overflow-hidden shadow-sm border border-[#D5CCD4] flex items-center justify-center bg-white">
                    <img src="https://i.ibb.co/3yyfhSTj/logo.jpg" alt="Soufflé VE Logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <!-- Tipografía Serif idéntica al estilo del catálogo[cite: 1, 2] -->
                    <span class="font-brand text-3xl font-bold tracking-wider text-[#4A3B32] block leading-none">soufflé</span>
                    <span class="text-[9px] text-[#8C7A6B] uppercase tracking-widest font-semibold block mt-1">Catálogo 2026 • Colección Exclusiva[cite: 2]</span>
                </div>
            </a>

            <div class="flex items-center gap-3">
                <a id="btn-whatsapp-general" href="#" target="_blank" class="bg-[#4A3B32] hover:bg-[#3D2E25] text-white font-medium text-xs sm:text-sm py-2.5 px-5 rounded-full flex items-center gap-2 transition duration-200 shadow-sm">
                    <span>WhatsApp</span>
                </a>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- SECCIÓN DE BÚSQUEDA Y FILTROS -->
        <section class="mb-8 space-y-4">
            <!-- BARRA DE BÚSQUEDA EN TIEMPO REAL -->
            <div class="relative max-w-md w-full">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-[#8C7A6B]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
                <input 
                    type="text" 
                    id="input-busqueda" 
                    oninput="aplicarFiltrosYBusqueda()"
                    placeholder="Buscar producto, marca o categoría..." 
                    class="block w-full pl-10 pr-10 py-3 border border-[#D5CCD4] rounded-2xl bg-white text-sm text-[#4A3B32] placeholder-[#8C7A6B] focus:outline-none focus:ring-2 focus:ring-[#4A3B32] focus:border-transparent transition shadow-sm"
                >
                <button 
                    id="btn-limpiar-busqueda" 
                    onclick="limpiarBusqueda()" 
                    class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-[#8C7A6B] hover:text-[#4A3B32] text-sm font-bold"
                >
                    ✕
                </button>
            </div>

            <!-- FILTRO POR CATEGORÍA -->
            <div>
                <div class="mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-[#8C7A6B]">Filtrar por Categoría:</span>
                </div>
                <div id="contenedor-categorias" class="flex flex-wrap gap-2">
                    <button onclick="filtrarCategoria('todas')" class="btn-filtro bg-[#4A3B32] text-white text-xs font-bold px-4 py-2 rounded-full shadow-sm transition">
                        Todas las Categorías
                    </button>
                </div>
            </div>
        </section>

        <!-- CABECERA DEL CATÁLOGO -->
        <div class="flex justify-between items-end mb-8 border-b border-[#E6E0D5] pb-4">
            <div>
                <h2 class="font-brand text-3xl font-bold text-[#4A3B32] tracking-tight">Prendas Disponibles[cite: 2]</h2>
                <p id="contador-productos" class="text-sm text-[#8C7A6B] font-medium">Cargando colección...</p>
            </div>
        </div>

        <!-- GRILLA DE PRODUCTOS -->
        <div id="grilla-productos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Los productos se cargarán dinámicamente aquí -->
        </div>

    </main>

    <!-- VENTANA MODAL PARA ZOOM / VISTA PREVIA AMPLIADA -->
    <div id="modal-zoom" class="fixed inset-0 z-50 bg-black/90 hidden flex items-center justify-center p-4">
        <button onclick="cerrarZoom()" class="absolute top-5 right-5 text-white bg-white/25 hover:bg-white/40 w-10 h-10 rounded-full flex items-center justify-center text-xl font-bold transition">✕</button>
        <div class="max-w-4xl max-h-[90vh] overflow-hidden flex items-center justify-center">
            <img id="imagen-zoom-src" src="" alt="Vista ampliada" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl">
        </div>
    </div>

    <!-- JAVASCRIPT LÓGICO Y ROBUSTO -->
    <script>
        let productosData = [];
        let tasaBCV = 0;
        let categoriaSeleccionadaActual = 'todas';

        // Configurar botón general de WhatsApp
        document.getElementById('btn-whatsapp-general').href = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent('¡Hola Soufflé VE! Quisiera hacer una consulta sobre la colección disponible.')}`;

        // Limpiar URL de imagen individual
        function limpiarUrlUnica(urlRaw) {
            if (!urlRaw) return '';
            const matchImg = String(urlRaw).match(/[img](.*?)\[\/img\]/i);
            if (matchImg && matchImg[1]) return matchImg[1].trim();

            const matchUrl = String(urlRaw).match(/\[url=(.*?)\]/i);
            if (matchUrl && matchUrl[1]) return matchUrl[1].trim();

            const matchSrc = String(urlRaw).match(/src=["'](.*?)["']/i);
            if (matchSrc && matchSrc[1]) return matchSrc[1].trim();

            return String(urlRaw).replace(/\[\/?(url\vert{}img).*?\]/gi, '').trim();
        }

        // Obtener array de fotos escaneando de forma inteligente todas las columnas
        function obtenerArrayFotos(prod) {
            let fotos = [];
            
            for (let key in prod) {
                let valor = prod[key];
                if (valor) {
                    let limpia = limpiarUrlUnica(valor);
                    if (limpia && limpia.startsWith('http') && !fotos.includes(limpia)) {
                        const kLower = key.toLowerCase();
                        if (!kLower.includes('precio') && !kLower.includes('talla') && !kLower.includes('id') && !kLower.includes('marca') && !kLower.includes('categoria') && !kLower.includes('nombre') && !kLower.includes('destacado')) {
                            
                            if (kLower.includes('imagen_url') || kLower === 'imagen' || kLower === 'foto') {
                                fotos.unshift(limpia);
                            } else {
                                fotos.push(limpia);
                            }
                        }
                    }
                }
            }
            
            if (fotos.length === 0) fotos.push('https://via.placeholder.com/400x400?text=Sin+Imagen');
            return fotos;
        }

        // Cargar datos con respaldo contra bloqueos CORS/Redirección
        async function cargarDatos() {
            try {
                const response = await fetch(API_URL, { method: 'GET', redirect: 'follow' });
                const data = await response.json();
                
                tasaBCV = Number(data.tasa_bcv || data.tasa || 0);
                productosData = data.productos || [];

                document.getElementById('tasa-bcv-display').innerText = `Bs. ${tasaBCV.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

                renderizarFiltrosCategorias();
                renderizarProductos(productosData);

            } catch (error) {
                console.error("Error al cargar los productos:", error);
                document.getElementById('contador-productos').innerText = "No se pudieron cargar los productos. Por favor reintenta en un momento.";
                document.getElementById('tasa-bcv-display').innerText = "N/D";
            }
        }

        function renderizarFiltrosCategorias() {
            const categorias = ['todas', ...new Set(productosData.map(p => p.categoria).filter(Boolean))];
            const contenedor = document.getElementById('contenedor-categorias');
            
            contenedor.innerHTML = categorias.map(cat => {
                const esTodas = cat === 'todas';
                const nombreMostrar = esTodas ? 'Todas las Categorías' : cat;
                const claseActiva = esTodas ? 'bg-[#4A3B32] text-white' : 'bg-white text-[#4A3B32] hover:bg-[#F2ECE4] border border-[#D5CCD4]';
                
                return `
                    <button onclick="filtrarCategoria('${cat}', this)" class="btn-filtro ${claseActiva} text-xs font-bold px-4 py-2 rounded-full shadow-sm transition">
                        ${nombreMostrar}
                    </button>
                `;
            }).join('');
        }

        function filtrarCategoria(catSeleccionada, elemento) {
            categoriaSeleccionadaActual = catSeleccionada;

            document.querySelectorAll('.btn-filtro').forEach(btn => {
                btn.className = 'btn-filtro bg-white text-[#4A3B32] hover:bg-[#F2ECE4] border border-[#D5CCD4] text-xs font-bold px-4 py-2 rounded-full shadow-sm transition';
            });

            if (elemento) {
                elemento.className = 'btn-filtro bg-[#4A3B32] text-white text-xs font-bold px-4 py-2 rounded-full shadow-sm transition';
            } else {
                const primerBoton = document.querySelector('.btn-filtro');
                if (primerBoton) primerBoton.className = 'btn-filtro bg-[#4A3B32] text-white text-xs font-bold px-4 py-2 rounded-full shadow-sm transition';
            }

            aplicarFiltrosYBusqueda();
        }

        function aplicarFiltrosYBusqueda() {
            const textoBusqueda = document.getElementById('input-busqueda').value.toLowerCase().trim();
            const btnLimpiar = document.getElementById('btn-limpiar-busqueda');

            if (textoBusqueda.length > 0) {
                btnLimpiar.classList.remove('hidden');
            } else {
                btnLimpiar.classList.add('hidden');
            }

            const resultado = productosData.filter(prod => {
                const coincideCat = categoriaSeleccionadaActual === 'todas' || 
                                     (prod.categoria && prod.categoria.toLowerCase() === categoriaSeleccionadaActual.toLowerCase());

                const nombre = prod.nombre ? prod.nombre.toLowerCase() : '';
                const marca = prod.marca ? prod.marca.toLowerCase() : '';
                const categoria = prod.categoria ? prod.categoria.toLowerCase() : '';
                
                const coincideTexto = nombre.includes(textoBusqueda) || marca.includes(textoBusqueda) || categoria.includes(textoBusqueda);

                return coincideCat && coincideTexto;
            });

            renderizarProductos(resultado);
        }

        function limpiarBusqueda() {
            document.getElementById('input-busqueda').value = '';
            aplicarFiltrosYBusqueda();
        }

        // Seleccionar talla mediante botones interactivos (pills)
        function seleccionarTalla(prodIndex, talla, btnElement) {
            const contenedorTallas = document.getElementById(`botones-tallas-${prodIndex}`);
            if (contenedorTallas) {
                Array.from(contenedorTallas.children).forEach(btn => {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold border border-[#D5CCD4] bg-white text-[#4A3B32] hover:bg-[#F2ECE4] transition";
                });
            }
            btnElement.className = "px-3 py-1.5 rounded-lg text-xs font-bold border border-[#4A3B32] bg-[#4A3B32] text-white shadow-sm transition";
            
            const cardElement = document.getElementById(`card-prod-${prodIndex}`);
            if (cardElement) {
                cardElement.setAttribute('data-talla-seleccionada', talla);
            }
        }

        // Cambiar foto activa en la tarjeta mediante los botones numéricos o el swipe
        function cambiarFoto(prodIndex, fotoUrl, indiceFoto) {
            const imgElement = document.getElementById(`img-prod-${prodIndex}`);
            if (imgElement) imgElement.src = fotoUrl;

            if (imgElement) imgElement.setAttribute('data-current-foto', indiceFoto);

            const contenedorBotones = document.getElementById(`botones-fotos-${prodIndex}`);
            if (contenedorBotones) {
                Array.from(contenedorBotones.children).forEach((btn, idx) => {
                    if (idx === indiceFoto) {
                        btn.className = "w-7 h-7 rounded-lg text-xs font-bold border border-[#4A3B32] bg-[#4A3B32] text-white shadow-sm transition";
                    } else {
                        btn.className = "w-7 h-7 rounded-lg text-xs font-bold border border-[#D5CCD4] bg-white text-[#4A3B32] hover:bg-[#F2ECE4] transition";
                    }
                });
            }
        }

        // Configuración de gestos táctiles (Swipe Horizontal) para las fotos
        function configurarSwipe(prodIndex, fotos) {
            if (fotos.length <= 1) return;
            const contenedorImg = document.getElementById(`contenedor-img-${prodIndex}`);
            if (!contenedorImg) return;

            let touchStartX = 0;
            let touchEndX = 0;

            contenedorImg.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            contenedorImg.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                manejarSwipe(prodIndex, fotos, touchStartX, touchEndX);
            }, { passive: true });
        }

        function manejarSwipe(prodIndex, fotos, startX, endX) {
            const umbralMinimo = 40;
            const diferencia = startX - endX;

            if (Math.abs(diferencia) < umbralMinimo) return;

            const imgElement = document.getElementById(`img-prod-${prodIndex}`);
            if (!imgElement) return;

            let indiceActual = parseInt(imgElement.getAttribute('data-current-foto') || '0', 10);

            if (diferencia > 0) {
                indiceActual = (indiceActual + 1) % fotos.length;
            } else {
                indiceActual = (indiceActual - 1 + fotos.length) % fotos.length;
            }

            cambiarFoto(prodIndex, fotos[indiceActual], indiceActual);
        }

        // Abrir Zoom / Vista Previa Ampliada
        function abrirZoom(prodIndex) {
            const imgElement = document.getElementById(`img-prod-${prodIndex}`);
            if (!imgElement) return;

            document.getElementById('imagen-zoom-src').src = imgElement.src;
            document.getElementById('modal-zoom').classList.remove('hidden');
        }

        function cerrarZoom() {
            document.getElementById('modal-zoom').classList.add('hidden');
        }

        // Función para enviar pedido con TALLA SELECCIONADA + FOTO ACTIVA
        function enviarPedidoWhatsApp(idx) {
            const prod = productosData[idx];
            if (!prod) return;

            const cardElement = document.getElementById(`card-prod-${idx}`);
            const tallaSeleccionada = cardElement ? cardElement.getAttribute('data-talla-seleccionada') : 'No especificada';

            const imgElement = document.getElementById(`img-prod-${idx}`);
            const fotoActivaUrl = imgElement ? imgElement.src : obtenerArrayFotos(prod)[0];

            const precioUsd = Number(prod.precio_usd) || 0;
            const precioBs = precioUsd * Number(tasaBCV);
            const precioBsFormateado = precioBs.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            const mensajeWS = `¡Hola Soufflé VE! Me interesa comprar el modelo: *${prod.nombre}* | Categoría: ${prod.categoria || 'N/A'} | Marca: ${prod.marca || 'N/A'} | Talla seleccionada: ${tallaSeleccionada} | Precio: $${precioUsd} / Bs. ${precioBsFormateado} | Foto del producto: ${fotoActivaUrl}`;

            const urlWS = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent(mensajeWS)}`;
            window.open(urlWS, '_blank');
        }

        function renderizarProductos(lista) {
            const grilla = document.getElementById('grilla-productos');
            const contador = document.getElementById('contador-productos');

            contador.innerText = `${lista.length} modelo(s) disponible(s)`;

            if (lista.length === 0) {
                grilla.innerHTML = `<p class="col-span-full text-center text-[#8C7A6B] py-12">No se encontraron productos que coincidan con tu búsqueda.</p>`;
                return;
            }

            grilla.innerHTML = lista.map((prod, index) => {
                const precioUsd = Number(prod.precio_usd) || 0;
                const precioBs = precioUsd * Number(tasaBCV);
                const precioBsFormateado = precioBs.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                const fotos = obtenerArrayFotos(prod);
                const listaTallas = prod.tallas ? String(prod.tallas).split(',').map(t => t.trim()).filter(Boolean) : ['Única'];
                const tallaPorDefecto = listaTallas[0];

                setTimeout(() => configurarSwipe(index, fotos), 50);

                return `
                    <div id="card-prod-${index}" data-talla-seleccionada="${tallaPorDefecto}" class="bg-white rounded-2xl shadow-sm border border-[#E6E0D5] overflow-hidden flex flex-col justify-between hover:shadow-md transition duration-200">
                        <div>
                            <!-- CONTENEDOR DE FOTO CON ZOOM, SWIPE Y BOTONES DE ÁNGULO -->
                            <div class="relative bg-white border-b border-[#F2ECE4]">
                                <div id="contenedor-img-${index}" class="h-64 overflow-hidden flex items-center justify-center p-3 cursor-pointer group touch-pan-y" onclick="abrirZoom(${index})" title="Haz clic para ampliar">
                                    <img id="img-prod-${index}" src="${fotos[0]}" data-current-foto="0" alt="${prod.nombre}" class="max-h-full max-w-full object-contain transition transform group-hover:scale-105 duration-200 select-none">
                                    <span class="absolute bottom-2 right-2 bg-[#4A3B32]/80 text-white text-[10px] px-2 py-0.5 rounded-md opacity-0 group-hover:opacity-100 transition pointer-events-none">🔍 Zoom</span>
                                </div>
                                ${prod.destacado ? `<span class="absolute top-3 left-3 bg-[#8C7A6B] text-white text-[10px] font-black uppercase px-2 py-1 rounded-md tracking-wider shadow-sm pointer-events-none">🔥 Destacado</span>` : ''}
                                
                                <!-- BOTONES SELECTORES DE FOTOS -->
                                ${fotos.length > 1 ? `
                                    <div id="botones-fotos-${index}" class="absolute bottom-3 left-3 flex gap-1.5 bg-white/90 backdrop-blur-sm p-1 rounded-xl shadow-sm border border-[#D5CCD4]">
                                        ${fotos.map((f, fIdx) => `
                                            <button onclick="event.stopPropagation(); cambiarFoto(${index}, '${f}', ${fIdx})" class="w-7 h-7 rounded-lg text-xs font-bold border ${fIdx === 0 ? 'border-[#4A3B32] bg-[#4A3B32] text-white shadow-sm' : 'border-[#D5CCD4] bg-white text-[#4A3B32] hover:bg-[#F2ECE4]'} transition" title="Ver foto ${fIdx + 1}">
                                                ${fIdx + 1}
                                            </button>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>

                            <div class="p-4">
                                <span class="text-[10px] font-bold uppercase text-[#8C7A6B] tracking-wider block mb-1">${prod.categoria || 'GENERAL'} • ${prod.marca || 'GENÉRICO'}</span>
                                <h3 class="font-brand font-bold text-[#4A3B32] text-xl leading-snug mb-3">${prod.nombre || 'Producto'}</h3>
                                
                                <!-- SELECTOR DE TALLA INTERACTIVO CON BOTONES (PILLS) -->
                                <div class="mb-4">
                                    <label class="block text-[11px] font-bold text-[#8C7A6B] uppercase mb-1.5">
                                        Selecciona tu Talla:
                                    </label>
                                    <div id="botones-tallas-${index}" class="flex flex-wrap gap-1.5">
                                        ${listaTallas.map((talla, tIdx) => `
                                            <button onclick="seleccionarTalla(${index}, '${talla}', this)" class="px-3 py-1.5 rounded-lg text-xs font-bold border ${tIdx === 0 ? 'border-[#4A3B32] bg-[#4A3B32] text-white shadow-sm' : 'border-[#D5CCD4] bg-white text-[#4A3B32] hover:bg-[#F2ECE4]'} transition">
                                                ${talla}
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="p-4 pt-0 border-t border-[#F2ECE4] mt-auto">
                            <div class="flex justify-between items-end my-3">
                                <div>
                                    <span class="text-2xl font-black text-[#4A3B32]">$${precioUsd}</span>
                                    <span class="text-[10px] text-[#8C7A6B] uppercase font-bold block">Tasa BCV</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-sm font-bold text-[#6B5A4E] block">Bs. ${precioBsFormateado}</span>
                                </div>
                            </div>
                            <button onclick="enviarPedidoWhatsApp(${index})" class="w-full bg-[#4A3B32] hover:bg-[#3D2E25] text-white font-bold text-sm py-2.5 rounded-xl flex items-center justify-center gap-2 transition duration-200">
                                <span>Pedir por WhatsApp</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Cargar datos al iniciar
        cargarDatos();
    </script>
</body>
</html>
