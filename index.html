<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Online</title>
    <!-- Tailwind CSS desde CDN gratuito -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased">

    <!-- BARRA SUPERIOR DE NOTIFICACIÓN -->
    <div class="bg-black text-white text-xs sm:text-sm py-2 px-4 flex flex-col sm:flex-row justify-between items-center gap-1 border-b border-gray-800">
        <div>
            <span>Pedidos directos por <strong class="text-green-400">WhatsApp</strong> | Envíos a todo el país</span>
        </div>
        <div class="flex items-center gap-2">
            <span>Tasa Oficial BCV: <strong id="tasa-bcv-display" class="text-yellow-400">Cargando...</strong></span>
            <span>•</span>
            <span>Pagos en Bs. y Divisas</span>
        </div>
    </div>

    <!-- ENCABEZADO PRINCIPAL -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center gap-2">
                <div class="bg-black text-white p-2 rounded-lg font-black text-xl">ST</div>
                <div>
                    <span class="font-extrabold text-lg block leading-none">Mi Tienda</span>
                    <span class="text-xs text-gray-500 uppercase tracking-widest font-semibold">Online Store</span>
                </div>
            </a>

            <div class="flex items-center gap-3">
                <a id="btn-whatsapp-general" href="#" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm py-2 px-4 rounded-full flex items-center gap-2 transition duration-200">
                    <span>WhatsApp</span>
                </a>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- SECCIÓN DE FILTROS -->
        <section class="mb-8">
            <div class="mb-3">
                <span class="text-sm font-bold uppercase tracking-wider text-gray-500">Filtrar por Marca:</span>
            </div>
            <div id="contenedor-marcas" class="flex flex-wrap gap-2">
                <button onclick="filtrarMarca('todas')" class="btn-filtro bg-black text-white text-xs font-bold px-4 py-2 rounded-full shadow-sm transition">
                    Todas las Marcas
                </button>
            </div>
        </section>

        <!-- CABECERA DEL CATÁLOGO -->
        <div class="flex justify-between items-end mb-6">
            <div>
                <h2 class="text-2xl font-extrabold text-gray-900">Catálogo Disponible</h2>
                <p id="contador-productos" class="text-sm text-gray-500 font-medium">Cargando productos...</p>
            </div>
        </div>

        <!-- GRILLA DE PRODUCTOS -->
        <div id="grilla-productos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Los productos se cargarán dinámicamente aquí -->
        </div>

    </main>

    <!-- JAVASCRIPT DE LA APLICACIÓN -->
    <script>
        // === CONFIGURACIÓN DE TU TIENDA ===
        // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbzukNs5x0ohnZ3mSD8YIaZILFtdo-hgZ3utYswJ64uxznXWq48qd_A-_wmhJsMgIc5Q/exec"; 
        
        // Coloca aquí tu número de WhatsApp con código de país (Ejemplo Venezuela: 584241234567)
        const TELEFONO_WHATSAPP = "584243566603";

        let productosData = [];
        let tasaBCV = 0;

        // Configurar botón general de WhatsApp
        document.getElementById('btn-whatsapp-general').href = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent('¡Hola! Quisiera hacer una consulta sobre los productos disponibles.')}`;

        // Cargar los datos desde Google Sheets
        async function cargarDatos() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                tasaBCV = data.tasa_bcv || 0;
                productosData = data.productos || [];

                // Mostrar tasa BCV
                document.getElementById('tasa-bcv-display').innerText = `Bs. ${tasaBCV.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

                // Renderizar marcas y productos
                renderizarFiltrosMarcas();
                renderizarProductos(productosData);

            } catch (error) {
                console.error("Error al cargar los productos:", error);
                document.getElementById('contador-productos').innerText = "Error al cargar los datos. Verifica la URL de tu API.";
            }
        }

        // Renderizar Filtros de Marcas Únicas
        function renderizarFiltrosMarcas() {
            const marcas = ['todas', ...new Set(productosData.map(p => p.marca).filter(Boolean))];
            const contenedor = document.getElementById('contenedor-marcas');
            
            contenedor.innerHTML = marcas.map(marca => {
                const esTodas = marca === 'todas';
                const nombreMostrar = esTodas ? 'Todas las Marcas' : marca;
                const claseActiva = esTodas ? 'bg-black text-white' : 'bg-white text-gray-700 hover:bg-gray-100 border border-gray-200';
                
                return `
                    <button onclick="filtrarMarca('${marca}', this)" class="btn-filtro ${claseActiva} text-xs font-bold px-4 py-2 rounded-full shadow-sm transition">
                        ${nombreMostrar}
                    </button>
                `;
            }).join('');
        }

        // Filtrar productos por marca
        function filtrarMarca(marcaSeleccionada, elemento) {
            document.querySelectorAll('.btn-filtro').forEach(btn => {
                btn.className = 'btn-filtro bg-white text-gray-700 hover:bg-gray-100 border border-gray-200 text-xs font-bold px-4 py-2 rounded-full shadow-sm transition';
            });

            if (elemento) {
                elemento.className = 'btn-filtro bg-black text-white text-xs font-bold px-4 py-2 rounded-full shadow-sm transition';
            }

            const filtrados = marcaSeleccionada === 'todas' 
                ? productosData 
                : productosData.filter(p => p.marca.toLowerCase() === marcaSeleccionada.toLowerCase());

            renderizarProductos(filtrados);
        }

        // Renderizar Tarjetas de Productos
        function renderizarProductos(lista) {
            const grilla = document.getElementById('grilla-productos');
            const contador = document.getElementById('contador-productos');

            contador.innerText = `${lista.length} modelo(s) disponible(s)`;

            if (lista.length === 0) {
                grilla.innerHTML = `<p class="col-span-full text-center text-gray-500 py-12">No hay productos disponibles para esta categoría.</p>`;
                return;
            }

            grilla.innerHTML = lista.map(prod => {
                const precioBs = prod.precio_usd * tasaBCV;
                const precioBsFormateado = precioBs.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                const mensajeWS = `Hola! Me interesa comprar el modelo: *${prod.nombre}* (Marca: ${prod.marca}, Talla: ${prod.tallas}, Precio: $${prod.precio_usd} / Bs. ${precioBsFormateado})`;
                const urlWS = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent(mensajeWS)}`;

                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition duration-200">
                        <div>
                            <div class="h-64 bg-gray-100 overflow-hidden relative">
                                <img src="${prod.imagen_url || 'https://via.placeholder.com/400x400?text=Sin+Imagen'}" alt="${prod.nombre}" class="w-full h-full object-cover">
                                ${prod.destacado ? `<span class="absolute top-3 left-3 bg-red-500 text-white text-[10px] font-black uppercase px-2 py-1 rounded-md tracking-wider">🔥 Destacado</span>` : ''}
                            </div>
                            <div class="p-4">
                                <span class="text-[10px] font-extrabold uppercase text-gray-400 tracking-wider block mb-1">${prod.marca}</span>
                                <h3 class="font-bold text-gray-900 text-base leading-snug mb-2">${prod.nombre}</h3>
                                <div class="mb-4">
                                    <span class="inline-block bg-gray-100 text-gray-700 text-xs font-semibold px-2.5 py-1 rounded-md">
                                        Tallas: ${prod.tallas || 'Única'}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="p-4 pt-0 border-t border-gray-50 mt-auto">
                            <div class="flex justify-between items-end my-3">
                                <div>
                                    <span class="text-2xl font-black text-gray-900">$${prod.precio_usd}</span>
                                    <span class="text-[10px] text-gray-400 uppercase font-bold block">Tasa BCV</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-sm font-bold text-gray-700 block">Bs. ${precioBsFormateado}</span>
                                </div>
                            </div>
                            <a href="${urlWS}" target="_blank" class="w-full bg-black hover:bg-gray-800 text-white font-bold text-sm py-2.5 rounded-xl flex items-center justify-center gap-2 transition duration-200">
                                <span>Pedir por WhatsApp</span>
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Ejecutar al cargar la página
        cargarDatos();
    </script>
</body>
</html>
